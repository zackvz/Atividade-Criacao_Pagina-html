<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulário de Cadastro</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family: Arial, Helvetica, sans-serif;
    }

    body{
        background-color:#f4f4f4;
        display:flex;
        justify-content:center;
        align-items:center;
        min-height:100vh;
        padding:20px;
    }

    form{
        width:100%;
        max-width:600px;
        background:white;
        padding:25px;
        border-radius:12px;
        box-shadow:0 0 10px rgba(0,0,0,0.2);
    }

    h1{
        text-align:center;
        margin-bottom:20px;
        color:#333;
    }

    fieldset{
        border:1px solid #ccc;
        border-radius:10px;
        padding:20px;
    }

    legend{
        font-weight:bold;
        padding:0 10px;
    }

    label{
        display:block;
        margin-top:12px;
        margin-bottom:5px;
        font-weight:bold;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="date"],
    select,
    textarea{
        width:100%;
        padding:10px;
        border:1px solid #ccc;
        border-radius:8px;
        font-size:16px;
    }

    input:focus,
    select:focus,
    textarea:focus{
        outline:none;
        border:2px solid #4CAF50;
        background-color:#f0fff0;
    }

    input:invalid{
        border-color:red;
    }

    textarea{
        resize:vertical;
    }

    .grupo-radio,
    .grupo-checkbox{
        margin-top:10px;
    }

    .grupo-radio label,
    .grupo-checkbox label{
        display:inline;
        font-weight:normal;
        margin-left:5px;
    }

    .botoes{
        margin-top:20px;
        display:flex;
        gap:10px;
        justify-content:center;
        flex-wrap:wrap;
    }

    button{
        padding:10px 20px;
        border:none;
        border-radius:8px;
        cursor:pointer;
        background-color:#4CAF50;
        color:white;
        font-size:16px;
        transition:0.3s;
    }

    button:hover{
        background-color:black;
        color:white;
    }

    @media(max-width:600px){
        form{
            padding:15px;
        }

        h1{
            font-size:22px;
        }
    }
</style>
</head>
<body>

<form action="/cadastro" method="post" autocomplete="on">

    <h1>Formulário de Cadastro</h1>

    <fieldset>
        <legend>Dados Pessoais</legend>

        <label for="nome">Nome</label>
        <input type="text"
               id="nome"
               name="nome"
               placeholder="Digite seu nome"
               minlength="3"
               maxlength="50"
               required>

        <label for="email">E-mail</label>
        <input type="email"
               id="email"
               name="email"
               placeholder="Digite seu e-mail"
               required>

        <label for="senha">Senha</label>
        <input type="password"
               id="senha"
               name="senha"
               minlength="6"
               required>

        <label for="data">Data de Nascimento</label>
        <input type="date"
               id="data"
               name="data"
               required>

        <label for="curso">Curso</label>
        <select id="curso" name="curso" required>
            <option value="">Selecione</option>
            <option>Análise e Desenvolvimento de Sistemas</option>
            <option>Ciência da Computação</option>
            <option>Engenharia de Software</option>
            <option>Sistemas de Informação</option>
        </select>

        <label>Sexo</label>

        <div class="grupo-radio">
            <input type="radio" id="masculino" name="sexo" value="Masculino">
            <label for="masculino">Masculino</label>

            <input type="radio" id="feminino" name="sexo" value="Feminino">
            <label for="feminino">Feminino</label>

            <input type="radio" id="outro" name="sexo" value="Outro">
            <label for="outro">Outro</label>
        </div>

        <label>Interesses</label>

        <div class="grupo-checkbox">
            <input type="checkbox" id="programacao" name="interesses">
            <label for="programacao">Programação</label>

            <input type="checkbox" id="design" name="interesses">
            <label for="design">Design</label>

            <input type="checkbox" id="games" name="interesses">
            <label for="games">Games</label>
        </div>

        <label for="comentarios">Comentários</label>
        <textarea id="comentarios"
                  name="comentarios"
                  rows="5"
                  placeholder="Digite seus comentários"></textarea>

        <label for="foto">Upload de Foto</label>
        <input type="file" id="foto" name="foto">

        <div class="botoes">
            <button type="submit">Enviar</button>
            <button type="reset">Limpar</button>
        </div>

    </fieldset>

</form>

</body>
</html>
